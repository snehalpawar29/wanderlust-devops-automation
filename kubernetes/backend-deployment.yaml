apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: wanderlust-ns
  labels:
    app: wanderlust-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wanderlust-backend
  template:
    metadata:
      name: backend-pod
      namespace: wanderlust-ns
      labels:
        app: wanderlust-backend
    spec:
      containers:
      - name: wanderlust-backend
        image: snehalpawar2945/wanderlust-backend:latest
        imagePullPolicy: Always
        ports:
          - containerPort: 5000

        env:
        - name: PORT
          value: "5000"
        - name: MONGODB_URI
          value: "mongodb://mongodb-service:27017/wanderlust"
        - name: REDIS_URL
          value: "redis://redis-service:6379"

      
