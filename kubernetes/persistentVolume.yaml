apiVersion: v1
kind: PersistentVolume
metadata:
  name: mongodb-pv
  namespace: wanderlust-ns
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /data/db
    type: DirectoryOrCreate
  persistentVolumeReclaimPolicy: Retain

  
