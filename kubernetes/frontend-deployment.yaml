apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: wanderlust-ns
  labels:
    app: wanderlust-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wanderlust-frontend
  template:
    metadata:
      name: frontend-pod
      namespace: wanderlust-ns
      labels:
        app: wanderlust-frontend
    spec:
      containers:
      - name: wanderlust-frontend
        image: snehalpawar2945/wanderlust-frontend:6
        imagePullPolicy: Always
        ports:
          - name: http
            containerPort: 80
            protocol: TCP
        startupProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "250m"