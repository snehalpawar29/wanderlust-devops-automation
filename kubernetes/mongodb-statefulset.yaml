apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb-statefulset
  namespace: wanderlust-ns
  labels:
    app: wanderlust-mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wanderlust-mongodb
  serviceName: "mongodb-service"
  template:
    metadata:
      name: mongodb-pod
      namespace: wanderlust-ns
      labels:
        app: wanderlust-mongodb
    spec:
      containers:
      - name: wanderlust-mongodb
        image: mongo:7
        imagePullPolicy: IfNotPresent
        ports:
          - name: mongodb
            containerPort: 27017
            protocol: TCP

        startupProbe:
          exec:
            command:
              - mongosh
              - --quiet
              - --eval
              - "quit(db.adminCommand('ping').ok ? 0 : 1)"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
        livenessProbe:
          exec:
            command:
              - mongosh
              - --quiet
              - --eval
              - "quit(db.adminCommand('ping').ok ? 0 : 1)"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
        readinessProbe:
          exec:
            command:
              - mongosh
              - --quiet
              - --eval
              - "quit(db.adminCommand('ping').ok ? 0 : 1)"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        volumeMounts:
          - name: mongodb-data
            mountPath: /data/db
      volumes:
        - name: mongodb-data
          persistentVolumeClaim:
            claimName: mongodb-pvc
