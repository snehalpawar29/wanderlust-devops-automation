---
- name: Install Docker and Jenkins on wanderlust-web-server
  hosts: localhost
  connection: local
  become: true

  tasks:
#----------Update Cache-----------
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
#----------Prerequisites Installation-----------   
    - name: Install System Prerequisites
      apt:
        name:
         - ca-certificates
         - curl
         - gnupg
         - openjdk-21-jre
         - fontconfig
        state: present
#----------Docker-----------
    - name: Create Docker Keyring directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker repository
      apt_repository:
        repo: >-
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }}
          stable
        state: present
        filename: docker


    - name: Update apt cache after adding Docker repository
      apt:
        update_cache: yes
    
    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          -  containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Ensure Docker is running & enabled
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add Ubuntu User to Docker group
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: yes
#----------Jenkins-----------
    - name: Download Jenkins GPG key
      get_url:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
        dest: /etc/apt/keyrings/jenkins-keyring.asc
        mode: '0644'

    - name: Add Jenkins LTS repository
      apt_repository:
        repo: >-
          deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc]
          https://pkg.jenkins.io/debian-stable
          binary/
        state: present
        filename: jenkins

    - name: Update apt cache after adding Jenkins repository
      apt:
        update_cache: yes

    - name: Install Jenkins
      apt:
        name: jenkins
        state: present
    
    - name: Ensure Jenkins is running & enabled
      systemd:
        name: jenkins
        state: started
        enabled: yes

    
    - name: Add Jenkins User to Docker group
      user:
        name: jenkins
        groups: docker
        append: yes
      notify: Restart Jenkins
#----------AWS CLI-----------
    - name: Install AWS CLI Prerequisites
      ansible.builtin.apt:
        name:
          - curl
          - unzip
        state: present
        update_cache: yes

    - name: Download AWS CLI V2
      ansible.builtin.get_url:
        url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
        dest: /tmp/awscliv2.zip
        mode: "0644"   

    - name: Extract
      ansible.builtin.unarchive:
        src: /tmp/awscliv2.zip
        dest: /tmp
        remote_src: yes

    - name: Install AWS CLI V2
      ansible.builtin.command:
        cmd: /tmp/aws/install
        creates: /usr/local/bin/aws

    - name: Verify AWS CLI V2 Installation
      ansible.builtin.command:
        cmd: aws --version
      register: aws_cli_version
      changed_when: false

    - name: Display AWS CLI Version
      ansible.builtin.debug:
        msg: "{{ aws_cli_version.stdout }}"  
#----------Kind-----------
    - name: Download Kind
      ansible.builtin.get_url:
        url: "https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}"
        dest: /usr/local/bin/kind
        mode: "0755"
        force: true

    - name: Verify kind Installation
      ansible.builtin.command:
        cmd: kind --version
      register: kind_version
      changed_when: false

    - name: Display kind Version
      ansible.builtin.debug:
        msg: "{{ kind_version.stdout }}"  
#----------kubectl-----------
    - name: Download kubectl
      ansible.builtin.get_url:
        url: "https://dl.k8s.io/release/v1.37.0/bin/linux/{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}/kubectl"
        dest: /usr/local/bin/kubectl
        mode: "0755"
        owner: root
        group: root
        # force: true

    - name: Verify kubectl Installation
      ansible.builtin.command:
        cmd: kubectl version --client
      register: kubectl_version
      changed_when: false

    - name: Display kubectl Version
      ansible.builtin.debug:
        msg: "{{ kubectl_version.stdout }}" 
#---------------eksctl---------------
    - name: Download & Extract eksctl
      ansible.builtin.get_url:
        url: "https://github.com/eksctl-io/eksctl/releases/latest/download/eksctl_Linux_amd64.tar.gz"
        dest: /tmp/eksctl.tar.gz
        mode: "0644"

    - name: Extract to tmp
      ansible.builtin.unarchive:
        src: /tmp/eksctl.tar.gz
        dest: /tmp
        remote_src: true
    
    - name: Copy to bin
      ansible.builtin.copy:
        src: /tmp/eksctl
        dest: /usr/local/bin/eksctl
        mode: "0755"
        remote_src: true
      become: true

    - name: Verify eksctl Installation
      ansible.builtin.command:
        cmd: eksctl version 
      register: eksctl_version
      changed_when: false

    - name: Display eksctl Version
      ansible.builtin.debug:
        msg: "{{ eksctl_version.stdout }}"        
#----------Sonarqube-----------
    - name: Configure vm.max_map_count for SonarQube
      ansible.posix.sysctl:
        name: vm.max_map_count
        value: "524288"
        state: present
        reload: true

    - name: Configure fs.file-max for SonarQube
      ansible.posix.sysctl:
        name: fs.file-max
        value: "131072"
        state: present
        reload: true

    - name: Create SonarQube Data Volume
      ansible.builtin.command:
        cmd: docker volume create sonarqube_data
      register: sonarqube_data_volume
      changed_when: sonarqube_data_volume.stdout != "sonarqube_data"

    - name: Create SonarQube extensions volume
      ansible.builtin.command:
        cmd: docker volume create sonarqube_extensions
      register: sonarqube_extensions_volume
      changed_when: sonarqube_extensions_volume.stdout != "sonarqube_extensions"


    - name: Create SonarQube Logs Volume
      ansible.builtin.command:
        cmd: docker volume create sonarqube_logs
      register: sonarqube_logs_volume
      changed_when: sonarqube_logs_volume.stdout != "sonarqube_logs"

    - name: pull SonarQube Community Image
      ansible.builtin.command:
        cmd: docker pull sonarqube:community

    - name: Run SonarQube
      ansible.builtin.command:
        cmd: >
          docker run -d
          --name sonarqube
          --restart unless-stopped
          -p 9000:9000
          -v sonarqube_data:/opt/sonarqube/data
          -v sonarqube_extensions:/opt/sonarqube/extensions
          -v sonarqube_logs:/opt/sonarqube/logs
          sonarqube:community
      register: sonarqube_container
      failed_when:
        - sonarqube_container.rc != 0
        - "'already in use' not in sonarqube_container.stderr"
    
    - name: Verify SonarQube container
      ansible.builtin.command:
        cmd: docker ps --filter name=sonarqube --format "{{ '{{' }}.Status{{ '}}' }}"
      register: sonarqube_status
      changed_when: false

    - name: Display OSnarqube installation 
      ansible.builtin.debug:
        msg:
          - "SonarQube: {{ sonarqube_status.stdout }}"
        


  handlers:
    - name: Restart Jenkins
      systemd:
        name: jenkins
        state: restarted

